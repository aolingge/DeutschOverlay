[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deutsch-overlay"
version = "0.1.0"
description = "German live captions for Windows games and videos"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [
  { name = "Aolinge", email = "153434584+aolingge@users.noreply.github.com" },
]
keywords = [
  "captions",
  "german",
  "language-learning",
  "overlay",
  "speech-translation",
  "subtitles",
  "whisper",
  "windows",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: German",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "PySide6>=6.8,<7",
  "numpy>=1.26,<3",
  "SoundCard>=0.4.4,<0.5",
]

[project.urls]
Homepage = "https://github.com/aolingge/DeutschOverlay"
Repository = "https://github.com/aolingge/DeutschOverlay"
Issues = "https://github.com/aolingge/DeutschOverlay/issues"
Changelog = "https://github.com/aolingge/DeutschOverlay/blob/main/CHANGELOG.md"
Releases = "https://github.com/aolingge/DeutschOverlay/releases"
Documentation = "https://github.com/aolingge/DeutschOverlay/tree/main/docs"

[project.optional-dependencies]
local = [
  "opencc>=1.4.2,<2",
  "faster-whisper>=1.2,<2",
  "ctranslate2>=4.5,<5",
  "transformers>=5.10,<6",
  "sentencepiece>=0.2,<1",
  "huggingface-hub>=0.25,<3",
  "sacremoses>=0.1,<1",
]
gpu = [
  "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
]
online = [
  "azure-cognitiveservices-speech>=1.40,<2",
  "keyring>=25,<27",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "PyInstaller>=6.10,<7",
]

[project.scripts]
deutsch-overlay = "deutsch_overlay.app:main"
deutsch-overlay-bridge = "deutsch_overlay.browser_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

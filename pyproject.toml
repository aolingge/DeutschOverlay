[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deutsch-overlay"
version = "0.1.0"
description = "German live captions for Windows games and videos"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6>=6.8,<7",
  "numpy>=1.26,<3",
  "SoundCard>=0.4.4,<0.5",
]

[project.optional-dependencies]
local = [
  "faster-whisper>=1.2,<2",
  "ctranslate2>=4.5,<5",
  "transformers>=5.10,<6",
  "sentencepiece>=0.2,<1",
  "huggingface-hub>=0.25,<2",
  "sacremoses>=0.1,<1",
]
gpu = [
  "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
]
online = [
  "azure-cognitiveservices-speech>=1.40,<2",
  "keyring>=25,<27",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "PyInstaller>=6.10,<7",
]

[project.scripts]
deutsch-overlay = "deutsch_overlay.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

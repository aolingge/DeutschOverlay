name: 问题反馈
description: 字幕没出现、字幕不对、声音采不到或界面异常
title: "[问题] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请先确认你用的是[最新发布版](https://github.com/aolingge/DeutschOverlay/releases/latest)。

        **不要**在 Issue 里粘贴 Azure 密钥、录音文件，或包含用户名的完整安装路径。
  - type: textarea
    id: symptom
    attributes:
      label: 出现了什么
      description: 描述看到的现象，并抄下设置窗口底部状态栏显示的文字。
      placeholder: 例如：播放德语视频时字幕条一直空白，状态栏显示“正在等待声音采集”。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …，选择播放设备 …
        2. 选择“仅德语”…
        3. 播放 …
        4. 期望 …，实际 …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 安装目录名形如 0.1.0-XXXXXXXXXXXXXXXX，或 EXE 属性里的文件版本。
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 识别模式
      options:
        - 本地 · CPU
        - 本地 · GPU (CUDA)
        - 在线 · Azure
        - 不确定
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2 (26100.x)
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: 显卡与显存
      placeholder: NVIDIA RTX 4060 Laptop 8 GB，或“无独立显卡”
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 声音来源
      description: 播放设备类型（可去掉个人字样）、正在播放的游戏或视频格式（有没有独占模式、有没有背景音乐）。
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认
      options:
        - label: 我用的是最新发布版，并且能稳定复现
          required: true
        - label: 这个 Issue 里没有密钥、录音或含用户名的完整路径
          required: true
